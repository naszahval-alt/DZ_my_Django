<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Рецепты</title>
</head>
<body>
    {% if message %}
        <h1>{{ message }}</h1>
        <ul>
            {% for recipe in recipes %}
                <li><a href="/{{ recipe }}/">{{ recipe }}</a></li>
            {% endfor %}
        </ul>
    {% else %}
        {% for ingredient, amount in recipe.items %}
            <p>{{ ingredient }}: {{ amount }}</p>
        {% empty %}
            <p>Такого рецепта не знаю :(</p>
        {% endfor %}
    {% endif %}
</body>
</html>
